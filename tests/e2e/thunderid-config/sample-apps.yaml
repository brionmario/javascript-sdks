#
# Declarative OAuth2 application registrations for every sample quickstart app under E2E test,
# imported via `POST /import` (see utils/import-config or run-e2e.sh): the six browser-testable
# apps (authorization_code) plus node/quickstart (client_credentials, no browser UI, no redirect
# URIs), and a shared CORS allowlist covering the six browser apps' origins. Double-brace
# placeholders below are filled from the `variables` map passed alongside this file's content —
# see constants/sample-apps.ts for the canonical port/clientId values these are expected to match.
#
# Note: this whole file is parsed as a Go template, comments included — never write a literal
# double-brace placeholder in prose here (even in a comment), or the template engine will try to
# resolve it as real template syntax and fail the import.
#
# Modeled directly on thunderid/tests/e2e/thunderid-config-sample-apps.yaml.

---
resource_type: application
id: 019a0000-0000-7000-8000-0000000000b1
ouHandle: default
name: E2E browser/quickstart
description: OAuth2 client for the browser SDK quickstart's E2E suite
type: browser
authFlowHandle: default-flow
isRegistrationFlowEnabled: false
isRecoveryFlowEnabled: false
isSignOutFlowEnabled: false
assertion:
  validityPeriod: 3600
loginConsent:
  validityPeriod: 0
allowedUserTypes:
  - Person
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: "{{.BROWSER_CLIENT_ID}}"
      redirectUris:
        {{- range .BROWSER_REDIRECT_URIS}}
        - {{.}}
        {{- end}}
      postLogoutRedirectUris:
        {{- range .BROWSER_REDIRECT_URIS}}
        - {{.}}
        {{- end}}
      grantTypes:
        - authorization_code
      responseTypes:
        - code
      tokenEndpointAuthMethod: none
      pkceRequired: true
      publicClient: true
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes: [given_name, family_name, email]
        idToken:
          validityPeriod: 3600
          userAttributes: [given_name, family_name, email]
          responseType: JWT
      userInfo:
        responseType: JSON
        userAttributes: [given_name, family_name, email]

